<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Zotero AI Sidebar 中性图标：靛紫渐变圆角块 + 白色对话气泡 + AI 星芒。
       不绑定任何一家服务的 logo，切到哪家都不违和。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f6ef7"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="88" height="88" rx="22" fill="url(#bg)"/>
  <!-- 对话气泡（左下带尾巴） -->
  <path d="M48 22c-15.5 0-28 10.4-28 23.2 0 7.3 4.1 13.9 10.6 18.2-.4 3.7-2 7.1-4.9 9.9-.7.7-.2 1.9.8 1.9 5.5-.1 10.5-2 14.4-4.8 2.3.5 4.7.8 7.1.8 15.5 0 28-10.4 28-23.2S63.5 22 48 22z" fill="#ffffff"/>
  <!-- 气泡内的四角星芒（用背景渐变色，视觉上像"镂空"） -->
  <path d="M48 32.5l3.6 8.9 8.9 3.6-8.9 3.6-3.6 8.9-3.6-8.9-8.9-3.6 8.9-3.6z" fill="url(#bg)"/>
</svg>
